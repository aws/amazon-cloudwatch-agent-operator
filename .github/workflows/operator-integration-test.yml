name: Operator Integration Test
# Release-image-validation dispatches pass a correlation-id; those runs get a
# title carrying it so the checker can find the exact run it triggered. 
run-name: ${{ inputs.correlation-id != '' && format('operator-image-validation [{0}]', inputs.correlation-id) || 'Operator Integration Test' }}
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches:
      - main
  workflow_dispatch:
    inputs:
      operator-image-uri:
        description: 'ECR repo URI of a released operator image to validate by digest (leave empty to build from source)'
        required: false
        type: string
        default: ''
      operator-image-digest:
        description: 'Digest of the released operator image'
        required: false
        type: string
        default: ''
      correlation-id:
        description: 'Unique per-dispatch id used to correlate this run back to its trigger'
        required: false
        type: string
        default: ''
      region:
        description: 'AWS region for ECR login (digest mode)'
        required: false
        type: string
        default: 'us-west-2'
  workflow_call:
    inputs:
      operator-image-uri:
        required: false
        type: string
        default: ''
      operator-image-digest:
        required: false
        type: string
        default: ''
      correlation-id:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: 'us-west-2'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  InstrumentationTest:
    name: InstrumentationTest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Start minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21

      - name: Deploy cert-manager to minikube
        run:
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.12.0/cert-manager.yaml

      - name: Verify minikube and cert-manager
        run: |
          sleep 10
          kubectl get pods -A

      - name: Prepare operator image
        id: opimg
        uses: ./.github/actions/prepare-operator-minikube-image
        with:
          operator-image-uri: ${{ inputs.operator-image-uri }}
          operator-image-digest: ${{ inputs.operator-image-digest }}
          region: ${{ inputs.region }}
          aws-role: ${{ secrets.TERRAFORM_AWS_ASSUME_ROLE }}

      - name: Test case for cloudwatch agent pod creation
        run: |
          kubectl apply -f integration-tests/manifests/cloudwatch-agent-daemonset.yaml -n amazon-cloudwatch
          sleep 20
          kubectl wait --for=condition=Ready pod --all -n amazon-cloudwatch

          pod_name="$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/component=amazon-cloudwatch-agent,app.kubernetes.io/instance=amazon-cloudwatch.cloudwatch-agent -o=jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          if [ -z "$pod_name" ]; then
            echo "Pod $pod_name is not created. Exiting with ERROR."
            echo "Pod is not created test case: FAIL"
          else
            echo "Pod $pod_name is created."
            echo "Pod is created test case: PASS"
          fi

      - name: Test for default instrumentation resources for Java
        run: |
          kubectl apply -f integration-tests/java/sample-deployment-java.yaml
          sleep 15
          kubectl wait --for=condition=Ready pod --all -n default
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/java/default_instrumentation_java_env_variables.json app_signals

      - name: Test for defined instrumentation resources for Java
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 15
          kubectl wait --for=condition=Ready pod --all -n default

          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test for default instrumentation resources for python
        run: |
          kubectl apply -f integration-tests/python/sample-deployment-python.yaml
          sleep 15
          kubectl wait --for=condition=Ready pod --all -n default --timeout=120s
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/python/default_instrumentation_python_env_variables.json app_signals

      - name: Test for defined instrumentation resources for python
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 15
          kubectl wait --for=condition=Ready pod --all -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test for default instrumentation resources for dotnet
        run: |
          cat integration-tests/dotnet/sample-deployment-dotnet.yaml
          kubectl apply -f integration-tests/dotnet/sample-deployment-dotnet.yaml
          sleep 15
          kubectl wait --for=condition=Available deployment/nginx -n default
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/dotnet/default_instrumentation_dotnet_env_variables.json app_signals

      - name: Test for defined instrumentation resources for dotnet
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 15
          kubectl wait --for=condition=Ready pod --all -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test for default instrumentation resources for nodejs
        run: |
          kubectl delete pods --all -n default
          sleep 15
          cat integration-tests/nodejs/sample-deployment-nodejs.yaml
          kubectl apply -f integration-tests/nodejs/sample-deployment-nodejs.yaml
          sleep 15
          kubectl wait --for=condition=Available deployment/nginx -n default
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/nodejs/default_instrumentation_nodejs_env_variables.json app_signals

      - name: Test for defined instrumentation resources for nodejs
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 15
          kubectl wait --for=condition=Available deployment/nginx -n default
          sleep 15
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test for default instrumentation resources for all languages
        run: |
          kubectl apply -f integration-tests/all-languages/sample-deployment-all-languages.yaml
          sleep 15
          kubectl wait --for=condition=Available deployment/nginx -n default
          sleep 15
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/all-languages/default_instrumentation_all-languages_env_variables.json app_signals

      - name: Test for defined instrumentation resources for all languages
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 15
          kubectl wait --for=condition=Available deployment/nginx -n default
          sleep 15
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test for default instrumentation resources for jmx
        run: |
          kubectl delete pods --all -n default
          sleep 5
          cat integration-tests/jmx/sample-deployment-jmx.yaml
          kubectl apply -f integration-tests/jmx/sample-deployment-jmx.yaml
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx -n default
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/jmx/default_instrumentation_jmx_env_variables.json app_signals

      - name: Test for defined instrumentation resources for jmx
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx -n default
          sleep 5
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Test case for cloudwatch agent without app signals pod creation
        run: |
          kubectl delete daemonset cloudwatch-agent -n amazon-cloudwatch
          sleep 5
          kubectl apply -f integration-tests/manifests/cloudwatch-agent-daemonset-no-app-signals.yaml -n amazon-cloudwatch
          sleep 20
          kubectl wait --for=condition=Ready pod --all -n amazon-cloudwatch

          pod_name="$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/component=amazon-cloudwatch-agent,app.kubernetes.io/instance=amazon-cloudwatch.cloudwatch-agent -o=jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          if [ -z "$pod_name" ]; then
            echo "Pod $pod_name is not created. Exiting with ERROR."
            echo "Pod is not created test case: FAIL"
          else
            echo "Pod $pod_name is created."
            echo "Pod is created test case: PASS"
          fi

      - name: Test for default instrumentation resources for jmx without app signals
        run: |
          kubectl delete pods --all -n default
          sleep 5
          cat integration-tests/jmx/sample-deployment-jmx.yaml
          kubectl apply -f integration-tests/jmx/sample-deployment-jmx.yaml
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx -n default
          kubectl get pods -A
          kubectl describe pods -n default
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/jmx/default_instrumentation_jmx_env_variables_no_app_signals.json no_app_signals

      - name: Test for defined instrumentation resources for jmx without app signals
        run: |
          kubectl apply -f integration-tests/manifests/sample-instrumentation.yaml
          kubectl delete pods --all -n default
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx -n default
          sleep 5
          go run integration-tests/manifests/cmd/validate_instrumentation_vars.go default integration-tests/manifests/cmd/ns_instrumentation_env_variables.json app_signals
          kubectl delete instrumentation sample-instrumentation

      - name: Enable Java profiling in the operator
        run: |
          # Pass java.profiling the way the Helm chart does, through --auto-instrumentation-config on the manager.
          CONFIG="$(jq -c . integration-tests/java-profiling/auto-instrumentation-config.json)"
          INDEX="$(kubectl get deployment cloudwatch-controller-manager -n amazon-cloudwatch -o json | jq '.spec.template.spec.containers | map(.name) | index("manager")')"
          kubectl patch deployment cloudwatch-controller-manager -n amazon-cloudwatch --type=json \
            -p "$(jq -cn --arg v "--auto-instrumentation-config=${CONFIG}" --argjson i "${INDEX}" '[{"op":"add","path":"/spec/template/spec/containers/\($i)/args/-","value":$v}]')"
          kubectl rollout status deployment/cloudwatch-controller-manager -n amazon-cloudwatch --timeout=180s
          kubectl get deployment cloudwatch-controller-manager -n amazon-cloudwatch -o jsonpath='{.spec.template.spec.containers[*].args}'; echo
          # A finished rollout does not mean the new manager's webhook serves yet, and the pod webhook ignores
          # failures. Dry-run a Java pod through admission until the reply carries the profiler variable.
          cat > /tmp/java-profiling-probe-pod.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: java-profiling-probe
            namespace: default
            annotations:
              instrumentation.opentelemetry.io/inject-java: "true"
          spec:
            containers:
              - name: app
                image: nginx:1.14.2
          EOF
          for i in $(seq 1 36); do
            out="$(kubectl create --dry-run=server -o json -f /tmp/java-profiling-probe-pod.yaml 2>/dev/null || true)"
            if grep -q '"OTEL_AWS_PROFILER_ENABLED"' <<< "$out"; then
              echo "Webhook injects Java profiling (attempt $i)"
              exit 0
            fi
            echo "Waiting for the webhook to inject Java profiling... ($i/36)"
            sleep 5
          done
          kubectl create --dry-run=server -o yaml -f /tmp/java-profiling-probe-pod.yaml || true
          kubectl logs -n amazon-cloudwatch -l app.kubernetes.io/name=amazon-cloudwatch-agent-operator --tail=100 || true
          echo "::error::operator webhook never became ready after enabling Java profiling"
          exit 1

      - name: Test for Java profiling injection
        run: |
          cat integration-tests/java-profiling/sample-deployment-java-profiling.yaml
          kubectl apply -f integration-tests/java-profiling/sample-deployment-java-profiling.yaml
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx-java-profiling -n default --timeout=180s
          kubectl describe pods -n default -l app=nginx-java-profiling
          go test ./integration-tests/java-profiling/validate
          go run ./integration-tests/java-profiling/cmd default integration-tests/java-profiling/java_profiling_expectations.json

      - name: Test for Java profiling opt-out
        run: |
          cat integration-tests/java-profiling/sample-deployment-java-profiling-opt-out.yaml
          kubectl apply -f integration-tests/java-profiling/sample-deployment-java-profiling-opt-out.yaml
          sleep 5
          kubectl wait --for=condition=Available deployment/nginx-java-profiling-opt-out -n default --timeout=180s
          kubectl describe pods -n default -l app=nginx-java-profiling-opt-out
          go run ./integration-tests/java-profiling/cmd default integration-tests/java-profiling/java_profiling_opt_out_expectations.json
          kubectl delete -f integration-tests/java-profiling/sample-deployment-java-profiling-opt-out.yaml
          kubectl delete -f integration-tests/java-profiling/sample-deployment-java-profiling.yaml

      # Check pod state/events/operator logs for any failure.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods -n default || true
          kubectl describe pods -n amazon-cloudwatch || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl logs -n amazon-cloudwatch -l app.kubernetes.io/name=amazon-cloudwatch-agent-operator --tail=200 || true

