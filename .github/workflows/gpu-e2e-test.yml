name: Run GPU E2E Test
env:
  TERRAFORM_AWS_ASSUME_ROLE: ${{ secrets.TERRAFORM_AWS_ASSUME_ROLE }}

on:
  workflow_dispatch:
    inputs:
      addon_name:
        required: true
        type: string
        default: "amazon-cloudwatch-observability"
        description: "GPU E2E Test"
      addon_version:
        required: true
        type: string
        default: "v1.1.0-eksbuild.1"
        description: "EKS addon version"
      run_in_beta:
        required: true
        type: boolean
        default: false
        description: "Target the beta EKS environment (requires eks_endpoint); default false uses the public endpoint"
      eks_endpoint:
        required: false
        type: string
        default: ""
        description: "Optional EKS API endpoint override (empty keeps the default/beta behaviour)"
      dcgm_image_registry:
        required: false
        type: string
        default: "nvcr.io/nvidia/k8s"
        description: "Registry of the dcgm-exporter image under test"
      dcgm_image_repository:
        required: false
        type: string
        default: "dcgm-exporter"
        description: "Repository of the dcgm-exporter image under test"
      dcgm_image_tag:
        required: false
        type: string
        default: ""
        description: "Tag of the dcgm-exporter image under test (empty uses the add-on default)"
      dcgm_image_source:
        required: false
        type: choice
        default: "addon"
        options:
          - addon
          - operator
        description: "dcgm image source when dcgm_image_tag is empty: addon (add-on default) or operator (versions.txt pin)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  GenerateTestMatrix:
    name: 'GenerateTestMatrix'
    runs-on: ubuntu-latest
    outputs:
      eks_addon_matrix: ${{ steps.set-matrix.outputs.eks_addon_matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: us-west-2

      - name: Generate matrix
        id: set-matrix
        run: |
          echo "::set-output name=eks_addon_matrix::$(echo $(cat integration-tests/generator/k8s_versions_matrix.json))"

      - name: Echo test plan matrix
        run: |
          echo "eks_addon_matrix: ${{ steps.set-matrix.outputs.eks_addon_matrix }}"
          echo "Addon name ${{ github.event.inputs.addon_name }}, addon version  ${{ github.event.inputs.addon_version }} "

  GPUE2ETest:
    needs: [GenerateTestMatrix]
    name: GPUE2ETest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arrays: ${{ fromJson(needs.GenerateTestMatrix.outputs.eks_addon_matrix) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: us-west-2

      - name: Confirm EKS Version Support
        run: |
          if [[ 
            $(go list -m k8s.io/client-go | cut -d ' ' -f 2 | cut -d '.' -f 2) -lt $( echo ${{ matrix.arrays.k8sVersion }} | cut -d '.' -f 2)
            || $(go list -m k8s.io/apimachinery | cut -d ' ' -f 2 | cut -d '.' -f 2) -lt $( echo ${{ matrix.arrays.k8sVersion }} | cut -d '.' -f 2)
            || $(go list -m k8s.io/component-base | cut -d ' ' -f 2 | cut -d '.' -f 2) -lt $( echo ${{ matrix.arrays.k8sVersion }} | cut -d '.' -f 2)
            || $(go list -m k8s.io/kubectl | cut -d ' ' -f 2 | cut -d '.' -f 2) -lt $( echo ${{ matrix.arrays.k8sVersion }} | cut -d '.' -f 2)
          ]]; then 
          echo k8s.io/client-go $(go list -m k8s.io/client-go) is less than ${{ matrix.arrays.k8sVersion }}
          echo or k8s.io/apimachinery $(go list -m k8s.io/apimachinery) is less than ${{ matrix.arrays.k8sVersion }}
          echo or k8s.io/component-base $(go list -m k8s.io/component-base) is less than ${{ matrix.arrays.k8sVersion }}
          echo or k8s.io/kubectl $(go list -m k8s.io/kubectl) is less than ${{ matrix.arrays.k8sVersion }}, fail test
          echo "please run go get -u && go mod tidy"
          exit 1; 
          fi
          
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform apply
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        env:
          TF_VAR_eks_endpoint: ${{ github.event.inputs.eks_endpoint }}
          RUN_IN_BETA: ${{ github.event.inputs.run_in_beta }}
          DCGM_IMAGE_REGISTRY: ${{ github.event.inputs.dcgm_image_registry }}
          DCGM_IMAGE_REPOSITORY: ${{ github.event.inputs.dcgm_image_repository }}
          DCGM_IMAGE_TAG: ${{ github.event.inputs.dcgm_image_tag }}
          DCGM_IMAGE_SOURCE: ${{ github.event.inputs.dcgm_image_source }}
        with:
          max_attempts: 1
          timeout_minutes: 60 # EKS takes about 20 minutes to spin up a cluster and service on the cluster
          retry_wait_seconds: 5
          command: |
            cd integration-tests/terraform/gpu

            if [ "$RUN_IN_BETA" = "true" ] && [ -z "$TF_VAR_eks_endpoint" ]; then
              echo "run_in_beta=true requires eks_endpoint" >&2; exit 1
            fi

            # Resolve the dcgm image: explicit tag wins; else operator source pins from versions.txt; else add-on default.
            REGISTRY="$DCGM_IMAGE_REGISTRY"; REPOSITORY="$DCGM_IMAGE_REPOSITORY"; TAG="$DCGM_IMAGE_TAG"
            if [ -z "$TAG" ] && [ "$DCGM_IMAGE_SOURCE" = "operator" ]; then
              REGISTRY="nvcr.io/nvidia/k8s"; REPOSITORY="dcgm-exporter"
              TAG="$(grep -v '^#' "$GITHUB_WORKSPACE/versions.txt" | grep dcgm-exporter | awk -F= '{print $2}' | tr -d '[:space:]')"
            fi
            export TF_VAR_dcgm_image="$(jq -nc --arg registry "$REGISTRY" --arg repository "$REPOSITORY" --arg tag "$TAG" '{registry: $registry, repository: $repository, tag: $tag}')"

            terraform init
            if terraform apply -var="beta=${{ github.event.inputs.run_in_beta }}" -var="addon_name=${{ github.event.inputs.addon_name }}" -var="addon_version=${{ github.event.inputs.addon_version }}" -var="k8s_version=${{ matrix.arrays.k8sVersion }}" --auto-approve; then
              terraform destroy -var="beta=${{ github.event.inputs.run_in_beta }}" -auto-approve
            else
              terraform destroy -var="beta=${{ github.event.inputs.run_in_beta }}" -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        env:
          TF_VAR_eks_endpoint: ${{ github.event.inputs.eks_endpoint }}
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/terraform/gpu

            terraform destroy -var="beta=${{ github.event.inputs.run_in_beta }}" --auto-approve

