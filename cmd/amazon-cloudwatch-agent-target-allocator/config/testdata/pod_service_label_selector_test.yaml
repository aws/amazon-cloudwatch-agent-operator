label_selector:
  app.kubernetes.io/instance: default.test
  app.kubernetes.io/managed-by: amazon-cloudwatch-agent-operator
pod_monitor_selector:
  matchlabels:
    release: test
  matchexpressions:
  - key: tier
    operator: In
    values:
    - web
    - api
service_monitor_selector:
  matchLabels:
    release: test
  matchExpressions:
  - key: team
    operator: Exists
config:
  scrape_configs:
    - job_name: prometheus
      static_configs:
        - targets: ["prom.domain:9001", "prom.domain:9002", "prom.domain:9003"]
          labels:
            my: label
