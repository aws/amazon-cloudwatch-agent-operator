exporters:
  otlphttp/cw_k8s_ci_v0_app_logs_dest:
    auth:
      authenticator: awscloudwatchlogsprovisioner/cw_k8s_ci_v0_logs
    compression: none
    endpoint: https://logs.us-west-2.amazonaws.com:443
    headers:
      x-aws-log-group: /aws/otel/containerinsights/test-cluster/application
      x-aws-log-stream: ${env:K8S_NODE_NAME}-application
    sending_queue:
      num_consumers: 10
      queue_size: 500
    tls:
      insecure: false
  otlphttp/cw_k8s_ci_v0_metrics_dest:
    auth:
      authenticator: sigv4auth/cw_k8s_ci_v0_metrics_dest
    endpoint: https://monitoring.us-west-2.amazonaws.com:443
    tls:
      insecure: false
  otlphttp/cw_k8s_ci_v0_node_logs_dest:
    auth:
      authenticator: awscloudwatchlogsprovisioner/cw_k8s_ci_v0_logs
    compression: none
    endpoint: https://logs.us-west-2.amazonaws.com:443
    headers:
      x-aws-log-group: /aws/otel/containerinsights/test-cluster/host
      x-aws-log-stream: ${env:K8S_NODE_NAME}-host
    sending_queue:
      num_consumers: 10
      queue_size: 500
    tls:
      insecure: false
extensions:
  awscloudwatchlogsprovisioner/cw_k8s_ci_v0_logs:
    additional_auth: sigv4auth/cw_k8s_ci_v0_logs_dest
    region: us-west-2
  sigv4auth/cw_k8s_ci_v0_logs_dest:
    region: us-west-2
    service: logs
  sigv4auth/cw_k8s_ci_v0_metrics_dest:
    region: us-west-2
    service: monitoring
processors:
  awsattributelimit/cw_k8s_ci_v0:
    max_total_attributes: 150
    unconditional_removal_keys:
    - k8s.node.label.topology.kubernetes.io/region
    - k8s.node.label.topology.kubernetes.io/zone
    - k8s.node.label.topology.ebs.csi.aws.com/zone
    - k8s.node.label.node.kubernetes.io/instance-type
    - k8s.node.label.kubernetes.io/hostname
    - k8s.node.label.helm.sh/chart
    - k8s.node.label.release
    - k8s.node.label.eks.amazonaws.com/nodegroup-image
    - k8s.node.label.k8s.io/cloud-provider-aws
    - k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateId
    - k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateVersion
    - k8s.pod.label.pod-template-hash
    - k8s.pod.label.controller-revision-hash
    unconditional_removal_prefixes:
    - k8s.node.label.feature.node.kubernetes.io/
    - k8s.node.label.beta.kubernetes.io/
    - k8s.node.label.failure-domain.beta.kubernetes.io/
    - k8s.node.label.alpha.eksctl.io/
  awsdevicepodcorrelation/cw_k8s_ci_v0:
    device_types:
    - device_id_attribute: neuroncore
      name: neuron-by-core
      resource_names:
      - aws.amazon.com/neuroncore
    - device_id_attribute: neurondevice
      name: neuron-by-device
      resource_names:
      - aws.amazon.com/neurondevice
      - aws.amazon.com/neuron
    - device_id_attribute: aws.efa.device
      name: efa
      resource_names:
      - vpc.amazonaws.com/efa
  awsneuron/cw_k8s_ci_v0: {}
  batch/cw_k8s_ci_v0_logs_dest:
    send_batch_max_size: 500
    send_batch_size: 500
    timeout: 5s
  batch/cw_k8s_ci_v0_metrics_dest:
    send_batch_max_size: 500
    send_batch_size: 500
    timeout: 10s
  filter/cw_k8s_ci_v0_cadvisor_empty:
    error_mode: ignore
    metrics:
      datapoint:
      - attributes["container"] == "" and attributes["pod"] == ""
      - attributes["container"] == "" and attributes["pod"] == nil
      - attributes["container"] == nil and attributes["pod"] == ""
      - attributes["container"] == nil and attributes["pod"] == nil
  filter/cw_k8s_ci_v0_cadvisor_pod:
    error_mode: ignore
    metrics:
      datapoint:
      - attributes["container"] == "POD"
  filter/cw_k8s_ci_v0_cadvisor_rollup:
    error_mode: ignore
    metrics:
      datapoint:
      - (attributes["container"] == nil or attributes["container"] == "") and attributes["pod"]
        != nil and attributes["pod"] != "" and IsMatch(metric.name, "^container_network_")
        != true
  filter/cw_k8s_ci_v0_neuron:
    error_mode: ignore
    metrics:
      metric:
      - IsMatch(name, "^(neuron|execution_|hardware_ecc_)") != true
  filter/cw_k8s_ci_v0_scrape_metadata:
    error_mode: ignore
    metrics:
      metric:
      - IsMatch(name, "^(up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling|scrape_series_added|node_scrape_collector_duration_seconds|node_scrape_collector_success)$")
  groupbyattrs/cw_k8s_ci_v0_cadvisor:
    keys:
    - container
    - pod
    - namespace
  groupbyattrs/cw_k8s_ci_v0_dcgm:
    keys:
    - pod
    - namespace
    - container
  groupbyattrs/cw_k8s_ci_v0_neuron:
    keys:
    - k8s.pod.name
    - k8s.namespace.name
    - k8s.container.name
    - runtime_tag
  k8sattributes/cw_k8s_ci_v0_node:
    auth_type: serviceAccount
    extract:
      labels:
      - from: node
        key_regex: (.*)
        tag_name: k8s.node.label.$$$1
      metadata:
      - k8s.node.name
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.node.name
  k8sattributes/cw_k8s_ci_v0_pod:
    auth_type: serviceAccount
    extract:
      labels:
      - from: pod
        key_regex: (.*)
        tag_name: k8s.pod.label.$$$1
      metadata:
      - k8s.pod.uid
      - k8s.node.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.replicaset.name
      - k8s.job.name
      - k8s.cronjob.name
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.name
      - from: resource_attribute
        name: k8s.namespace.name
  metricstarttime/cw_k8s_ci_v0: {}
  resourcedetection/cw_k8s_ci_v0:
    detectors:
    - eks
    - ec2
    ec2:
      resource_attributes:
        cloud.account.id:
          enabled: true
        cloud.availability_zone:
          enabled: true
        cloud.platform:
          enabled: true
        cloud.provider:
          enabled: true
        cloud.region:
          enabled: true
        host.id:
          enabled: true
        host.image.id:
          enabled: true
        host.name:
          enabled: true
        host.type:
          enabled: true
  transform/cw_k8s_ci_v0_cadvisor_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"]
        != nil and attributes["container"] != ""
      - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"]
        != nil
      - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"]
        != nil
    - context: datapoint
      statements:
      - set(attributes["container"], resource.attributes["container"]) where resource.attributes["container"]
        != nil
      - set(attributes["pod"], resource.attributes["pod"]) where resource.attributes["pod"]
        != nil
      - set(attributes["namespace"], resource.attributes["namespace"]) where resource.attributes["namespace"]
        != nil
  transform/cw_k8s_ci_v0_clear_schema_url:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.schema_url, "")
  transform/cw_k8s_ci_v0_dcgm_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"]
        != nil
      - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"]
        != nil
      - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"]
        != nil
    - context: datapoint
      statements:
      - set(attributes["pod"], resource.attributes["pod"]) where resource.attributes["pod"]
        != nil
      - set(attributes["namespace"], resource.attributes["namespace"]) where resource.attributes["namespace"]
        != nil
      - set(attributes["container"], resource.attributes["container"]) where resource.attributes["container"]
        != nil
      - delete_key(attributes, "Hostname") where attributes["Hostname"] != nil
      - delete_key(attributes, "pci_bus_id") where attributes["pci_bus_id"] != nil
  transform/cw_k8s_ci_v0_ebs_csi_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["instance_id"], attributes["instance_id"]) where attributes["instance_id"]
        != nil
      - set(resource.attributes["volume_id"], attributes["volume_id"]) where attributes["volume_id"]
        != nil
      - delete_key(attributes, "instance_id") where attributes["instance_id"] != nil
      - delete_key(attributes, "volume_id") where attributes["volume_id"] != nil
  transform/cw_k8s_ci_v0_efa_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.pod.name"], attributes["k8s.pod.name"]) where
        attributes["k8s.pod.name"] != nil
      - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"])
        where attributes["k8s.namespace.name"] != nil
      - set(resource.attributes["k8s.container.name"], attributes["k8s.container.name"])
        where attributes["k8s.container.name"] != nil
      - delete_key(attributes, "k8s.pod.name") where attributes["k8s.pod.name"] !=
        nil
      - delete_key(attributes, "k8s.namespace.name") where attributes["k8s.namespace.name"]
        != nil
      - delete_key(attributes, "k8s.container.name") where attributes["k8s.container.name"]
        != nil
  transform/cw_k8s_ci_v0_lis_csi_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["instance_id"], attributes["instance_id"]) where attributes["instance_id"]
        != nil
      - set(resource.attributes["volume_id"], attributes["volume_id"]) where attributes["volume_id"]
        != nil
      - delete_key(attributes, "instance_id") where attributes["instance_id"] != nil
      - delete_key(attributes, "volume_id") where attributes["volume_id"] != nil
  transform/cw_k8s_ci_v0_logs_clear_schema_url:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(resource.schema_url, "")
  transform/cw_k8s_ci_v0_logs_set_cloud_resource_id:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["cloud.resource_id"], Concat(["arn:aws:eks:", attributes["cloud.region"],
        ":", attributes["cloud.account.id"], ":cluster/", attributes["k8s.cluster.name"]],
        "")) where attributes["cloud.region"] != nil and attributes["cloud.account.id"]
        != nil and attributes["k8s.cluster.name"] != nil
  transform/cw_k8s_ci_v0_logs_set_cluster_and_node:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["k8s.cluster.name"], "test-cluster")
      - set(attributes["k8s.node.name"], "${env:K8S_NODE_NAME}")
  transform/cw_k8s_ci_v0_logs_set_scope_app:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "application-logs")
  transform/cw_k8s_ci_v0_logs_set_scope_host:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "host-logs")
  transform/cw_k8s_ci_v0_logs_set_workload:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where
        attributes["k8s.deployment.name"] != nil
      - set(attributes["k8s.workload.type"], "Deployment") where attributes["k8s.deployment.name"]
        != nil
      - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.statefulset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "StatefulSet") where attributes["k8s.statefulset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.daemonset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "DaemonSet") where attributes["k8s.daemonset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.workload.name"]
        == nil and attributes["k8s.job.name"] != nil
      - set(attributes["k8s.workload.type"], "Job") where attributes["k8s.job.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.cronjob.name"]
        != nil
      - set(attributes["k8s.workload.type"], "CronJob") where attributes["k8s.cronjob.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.replicaset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "ReplicaSet") where attributes["k8s.replicaset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["service.name"], attributes["k8s.workload.name"]) where attributes["service.name"]
        == nil and attributes["k8s.workload.name"] != nil
  transform/cw_k8s_ci_v0_neuron_hw_attrs:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["aws.neuron.device"], attributes["neurondevice"]) where attributes["neurondevice"]
        != nil
      - set(attributes["aws.neuron.core"], attributes["neuroncore"]) where attributes["neuroncore"]
        != nil
      - delete_key(attributes, "neuroncore") where attributes["neuroncore"] != nil
      - delete_key(attributes, "neurondevice") where attributes["neurondevice"] !=
        nil
      - delete_key(attributes, "instance_type") where attributes["instance_type"]
        != nil
  transform/cw_k8s_ci_v0_neuron_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["aws.neuron.runtime.tag"], attributes["runtime_tag"]) where
        attributes["runtime_tag"] != nil
      - delete_key(attributes, "runtime_tag") where attributes["runtime_tag"] != nil
  transform/cw_k8s_ci_v0_promote_node_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.node.name"], attributes["node_name"]) where attributes["node_name"]
        != nil
  transform/cw_k8s_ci_v0_set_cloud_resource_id:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.attributes["cloud.resource_id"], Concat(["arn:aws:eks:", resource.attributes["cloud.region"],
        ":", resource.attributes["cloud.account.id"], ":cluster/", resource.attributes["k8s.cluster.name"]],
        "")) where resource.attributes["cloud.region"] != nil and resource.attributes["cloud.account.id"]
        != nil and resource.attributes["k8s.cluster.name"] != nil
  transform/cw_k8s_ci_v0_set_cluster_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.cluster.name"], "test-cluster")
  transform/cw_k8s_ci_v0_set_node_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["node_name"], "${env:K8S_NODE_NAME}")
  transform/cw_k8s_ci_v0_set_scope_cadvisor:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.name, "github.com/google/cadvisor")
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "cadvisor")
  transform/cw_k8s_ci_v0_set_scope_dcgm:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.name, "github.com/NVIDIA/dcgm-exporter")
      - set(scope.version, "4.6.0-4.8.3-distroless")
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "dcgm")
  transform/cw_k8s_ci_v0_set_scope_ebs_csi:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "ebs-csi")
  transform/cw_k8s_ci_v0_set_scope_efa:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "efa")
  transform/cw_k8s_ci_v0_set_scope_kubeletstats:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "kubeletstats")
  transform/cw_k8s_ci_v0_set_scope_lis_csi:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "lis-csi")
  transform/cw_k8s_ci_v0_set_scope_neuron_monitor:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.name, "awsneuron")
      - set(scope.version, "1.12.0")
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "neuron-monitor")
  transform/cw_k8s_ci_v0_set_scope_node_exporter:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.name, "github.com/prometheus/node_exporter")
      - set(scope.version, "v1.12.1")
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "node-exporter")
  transform/cw_k8s_ci_v0_set_unit:
    error_mode: ignore
    metric_statements:
    - context: metric
      statements:
      - set(unit, "s") where IsMatch(name, ".*_seconds(_total)?$")
      - set(unit, "ms") where IsMatch(name, ".*_milliseconds(_total)?$")
      - set(unit, "us") where IsMatch(name, ".*_microseconds(_total)?$")
      - set(unit, "ns") where IsMatch(name, ".*_nanoseconds(_total)?$")
      - set(unit, "By") where IsMatch(name, ".*_bytes(_total)?$")
      - set(unit, "KBy") where IsMatch(name, ".*_kilobytes(_total)?$")
      - set(unit, "MBy") where IsMatch(name, ".*_megabytes(_total)?$")
      - set(unit, "GBy") where IsMatch(name, ".*_gigabytes(_total)?$")
      - set(unit, "KiBy") where IsMatch(name, ".*_kibibytes(_total)?$")
      - set(unit, "MiBy") where IsMatch(name, ".*_mebibytes(_total)?$")
      - set(unit, "GiBy") where IsMatch(name, ".*_gibibytes(_total)?$")
      - set(unit, "Cel") where IsMatch(name, ".*_celsius$")
      - set(unit, "Hz") where IsMatch(name, ".*_hertz$")
      - set(unit, "1") where IsMatch(name, ".*_ratio$")
      - set(unit, "%") where IsMatch(name, ".*_percent$")
      - set(unit, "V") where IsMatch(name, ".*_volts$")
      - set(unit, "W") where IsMatch(name, ".*_watts$")
      - set(unit, "J") where IsMatch(name, ".*_joules$")
      - set(unit, "A") where IsMatch(name, ".*_amperes$")
      - set(unit, "m") where IsMatch(name, ".*_meters(_total)?$")
      - set(unit, "1") where unit == "" and IsMatch(name, ".*_total$")
      - set(unit, "%") where name == "DCGM_FI_DEV_GPU_UTIL"
      - set(unit, "%") where name == "DCGM_FI_DEV_MEM_COPY_UTIL"
      - set(unit, "%") where name == "DCGM_FI_PROF_PIPE_TENSOR_ACTIVE"
      - set(unit, "MiBy") where name == "DCGM_FI_DEV_FB_USED"
      - set(unit, "MiBy") where name == "DCGM_FI_DEV_FB_FREE"
      - set(unit, "MiBy") where name == "DCGM_FI_DEV_FB_TOTAL"
      - set(unit, "Cel") where name == "DCGM_FI_DEV_GPU_TEMP"
      - set(unit, "W") where name == "DCGM_FI_DEV_POWER_USAGE"
      - set(unit, "MHz") where name == "DCGM_FI_DEV_SM_CLOCK"
      - set(unit, "By") where IsMatch(name, "^neuroncore_memory_usage_.*")
  transform/cw_k8s_ci_v0_set_workload:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.deployment.name"])
        where resource.attributes["k8s.deployment.name"] != nil
      - set(resource.attributes["k8s.workload.type"], "Deployment") where resource.attributes["k8s.deployment.name"]
        != nil
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.statefulset.name"])
        where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.statefulset.name"]
        != nil
      - set(resource.attributes["k8s.workload.type"], "StatefulSet") where resource.attributes["k8s.statefulset.name"]
        != nil and resource.attributes["k8s.workload.type"] == nil
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.daemonset.name"])
        where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.daemonset.name"]
        != nil
      - set(resource.attributes["k8s.workload.type"], "DaemonSet") where resource.attributes["k8s.daemonset.name"]
        != nil and resource.attributes["k8s.workload.type"] == nil
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.job.name"])
        where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.job.name"]
        != nil
      - set(resource.attributes["k8s.workload.type"], "Job") where resource.attributes["k8s.job.name"]
        != nil and resource.attributes["k8s.workload.type"] == nil
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.cronjob.name"])
        where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.cronjob.name"]
        != nil
      - set(resource.attributes["k8s.workload.type"], "CronJob") where resource.attributes["k8s.cronjob.name"]
        != nil and resource.attributes["k8s.workload.type"] == nil
      - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.replicaset.name"])
        where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.replicaset.name"]
        != nil
      - set(resource.attributes["k8s.workload.type"], "ReplicaSet") where resource.attributes["k8s.replicaset.name"]
        != nil and resource.attributes["k8s.workload.type"] == nil
receivers:
  awsefareceiver/cw_k8s_ci_v0:
    collection_interval: 30s
  filelog/cw_k8s_ci_v0_app:
    exclude:
    - /var/log/containers/cloudwatch-agent*
    - /var/log/containers/fluent-bit*
    - /var/log/containers/aws-node*
    - /var/log/containers/kube-proxy*
    include:
    - /var/log/containers/*.log
    include_file_name: false
    include_file_path: true
    max_concurrent_files: 100
    operators:
    - id: extract_metadata_from_filepath
      parse_from: attributes["log.file.path"]
      parse_to: resource
      regex: ^.*\/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[a-f0-9]{64}\.log$
      type: regex_parser
    - from: resource.pod
      to: resource["k8s.pod.name"]
      type: move
    - from: resource.namespace
      to: resource["k8s.namespace.name"]
      type: move
    - from: resource.container
      to: resource["k8s.container.name"]
      type: move
    - id: parse_container_log
      type: container_log_parser
    start_at: end
  filelog/cw_k8s_ci_v0_node:
    include:
    - /var/log/messages
    - /var/log/dmesg
    - /var/log/secure
    include_file_name: false
    include_file_path: true
    max_concurrent_files: 100
    start_at: end
  kubeletstats/cw_k8s_ci_v0:
    auth_type: serviceAccount
    collection_interval: 30s
    endpoint: https://${env:HOST_IP}:10250
    insecure_skip_verify: true
    metric_groups:
    - pod
    - container
    - node
    metrics:
      container.cpu.usage:
        enabled: true
      container.uptime:
        enabled: true
      k8s.container.cpu_limit_utilization:
        enabled: true
      k8s.container.cpu_request_utilization:
        enabled: true
      k8s.container.memory_limit_utilization:
        enabled: true
      k8s.container.memory_request_utilization:
        enabled: true
      k8s.node.cpu.usage:
        enabled: true
      k8s.node.uptime:
        enabled: true
      k8s.pod.cpu.usage:
        enabled: true
      k8s.pod.cpu_limit_utilization:
        enabled: true
      k8s.pod.cpu_request_utilization:
        enabled: true
      k8s.pod.memory_limit_utilization:
        enabled: true
      k8s.pod.memory_request_utilization:
        enabled: true
      k8s.pod.uptime:
        enabled: true
  prometheus/cw_k8s_ci_v0_cadvisor:
    config:
      scrape_configs:
      - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        job_name: cadvisor
        metrics_path: /metrics/cadvisor
        scheme: https
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - ${env:HOST_IP}:10250
        tls_config:
          insecure_skip_verify: true
  prometheus/cw_k8s_ci_v0_dcgm:
    config:
      scrape_configs:
      - job_name: dcgm-exporter
        scheme: https
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - dcgm-exporter-service:9400
        tls_config:
          ca_file: /etc/amazon-cloudwatch-observability-agent-client-cert/tls-ca.crt
  prometheus/cw_k8s_ci_v0_ebs_csi_node:
    config:
      scrape_configs:
      - job_name: ebs-csi-node
        kubernetes_sd_configs:
        - namespaces:
            names:
            - kube-system
          role: pod
        relabel_configs:
        - action: keep
          regex: ebs-csi-node
          source_labels:
          - __meta_kubernetes_pod_label_app
        - action: keep
          regex: ${env:K8S_NODE_NAME}
          source_labels:
          - __meta_kubernetes_pod_node_name
        - action: keep
          regex: metrics
          source_labels:
          - __meta_kubernetes_pod_container_port_name
        scrape_interval: 30s
        scrape_timeout: 10s
  prometheus/cw_k8s_ci_v0_lis_csi_node:
    config:
      scrape_configs:
      - job_name: lis-csi-node
        kubernetes_sd_configs:
        - namespaces:
            names:
            - kube-system
          role: pod
        relabel_configs:
        - action: keep
          regex: ec2-instance-store-plugin
          source_labels:
          - __meta_kubernetes_pod_label_app
        - action: keep
          regex: ${env:K8S_NODE_NAME}
          source_labels:
          - __meta_kubernetes_pod_node_name
        - action: keep
          regex: metrics
          source_labels:
          - __meta_kubernetes_pod_container_port_name
        scrape_interval: 30s
        scrape_timeout: 10s
  prometheus/cw_k8s_ci_v0_neuron:
    config:
      scrape_configs:
      - job_name: neuron-monitor
        scheme: https
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - neuron-monitor-service:8000
        tls_config:
          ca_file: /etc/amazon-cloudwatch-observability-agent-client-cert/tls-ca.crt
  prometheus/cw_k8s_ci_v0_node_exporter:
    config:
      scrape_configs:
      - job_name: node-exporter
        scheme: https
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - node-exporter-service:9487
        tls_config:
          ca_file: /etc/amazon-cloudwatch-observability-agent-client-cert/tls-ca.crt
