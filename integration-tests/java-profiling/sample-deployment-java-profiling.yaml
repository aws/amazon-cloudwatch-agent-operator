# Java profiling: three Java containers (app, worker, custom) are profiled and share one profiler volume; the sidecar is not
# Java-instrumented and must get nothing from the profiler. worker loads an (optional) Secret with envFrom, which does
# not stop it being profiled. custom brings its own volume and OTEL_AWS_PROFILER_DATA_DIR (the way to give the profiler
# more space), which the operator keeps; the operator's volume is still mounted in it, unused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-java-profiling
spec:
  selector:
    matchLabels:
      app: nginx-java-profiling
  template:
    metadata:
      labels:
        app: nginx-java-profiling
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
        instrumentation.opentelemetry.io/java-container-names: "app,worker,custom"
    spec:
      containers:
        - name: app
          image: nginx:1.14.2
        - name: worker
          image: nginx:1.14.2
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - secretRef:
                name: java-profiling-worker-credentials
                optional: true
        - name: custom
          image: nginx:1.14.2
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: OTEL_AWS_PROFILER_DATA_DIR
              value: /profiler-own/custom
          volumeMounts:
            - name: profiler-own
              mountPath: /profiler-own
        - name: sidecar
          image: nginx:1.14.2
          command: ["sh", "-c", "sleep 3600"]
      restartPolicy: Always
      volumes:
        - name: profiler-own
          emptyDir:
            sizeLimit: 512Mi
